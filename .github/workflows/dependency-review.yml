name: scheduled-dependency-review
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/check-dependencies.test.mjs
      - run: npm run check:dependencies
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-advisory-report
          path: dependency-test-results/summary.json
          retention-days: 7
