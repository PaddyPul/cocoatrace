name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:regressions
      - run: npm run check:workspace-states
      - run: npm run check:quality
      - run: npm run test:backlog
      - run: npm run check:risks
      - run: npm run check:pilot-evidence
      - run: npm run check:authorization
      - run: npm run check:mutation-audits
      - run: npm run check:branding
      - run: npm run test:locale
      - run: npm run test:web-boundaries
      - run: npm run test:workspace-tools
      - run: npm run test:recall-drill
      - run: npm run test:pilot-load
      - run: node --test scripts/check-dependencies.test.mjs scripts/build-metadata.test.mjs
      - run: npm run check:dependencies
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-advisory-report
          path: dependency-test-results/summary.json
          retention-days: 7
      - run: npm run typecheck
      - run: npm test --workspace=api
      - run: npm run build --workspace=api
      - run: npm run build --workspace=web
      - run: npm run check:web-budget
      - name: Validate production configuration contract
        run: |
          npm run check:production
          node -e "require('./api/dist/config/env.js')"
        env:
          APP_ENV: production
          NODE_ENV: production
          DEMO_MODE: "false"
          DATABASE_URL: postgresql://ci_user:ci_password@database.invalid:5432/cocoatrace
          JWT_SECRET: ci-only-production-validation-secret-32-characters
          WEB_URL: https://web.ci.invalid
          PUBLIC_WEB_URL: https://web.ci.invalid
          COOKIE_SECURE: "true"
          APP_VERSION: ${{ github.sha }}
          EVIDENCE_STORAGE_DRIVER: s3
          EVIDENCE_STORAGE_ENDPOINT: https://storage.ci.invalid
          EVIDENCE_STORAGE_REGION: us-east-1
          EVIDENCE_STORAGE_BUCKET: cocoatrace-production-ci
          EVIDENCE_STORAGE_ACCESS_KEY: ci-only-access-key
          EVIDENCE_STORAGE_SECRET_KEY: ci-only-secret-key
          EVIDENCE_STORAGE_SSE: AES256
          EVIDENCE_STORAGE_AUTO_CREATE_BUCKET: "false"
          EVIDENCE_UPLOAD_SIGNING_SECRET: ci-only-upload-signing-secret-32-characters
          EVIDENCE_SCANNER_DRIVER: clamav
          EVIDENCE_SCANNER_HOST: scanner.ci.invalid

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/check-container-security.test.mjs
      - name: Build, verify runtime contents and scan API/web images
        run: node scripts/check-container-security.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-security-reports
          path: container-test-results/*.json
          retention-days: 7

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/recall-drill.mjs --invalidate
      - run: node --import tsx scripts/pilot-load.mjs --invalidate
      - name: Test PostgreSQL, private S3 storage and ClamAV adapters
        run: npm run test:integration:docker
      - run: npm run check:pilot-load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-load-summary
          path: pilot-load-test-results/summary.json
          if-no-files-found: warn
          retention-days: 30
      - run: npm run check:recall-drill
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recall-tabletop-summary
          path: recall-drill-test-results/summary.json
          if-no-files-found: warn
          retention-days: 30

  browser-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:browser
      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run isolated identity, trade and recall browser journeys
        run: npm run test:browser:docker
      - name: Upload sanitized browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-identity-safe-diagnostics
          path: browser-test-results/safe/
          if-no-files-found: ignore
          retention-days: 7

  migration-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test fresh production startup and data-preserving upgrades
        run: npm run test:migrations:docker

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/secret-scan.test.mjs scripts/release-candidate.test.mjs
      - run: npm run check:secrets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-safe-summary
          path: secret-scan-test-results/summary.json
          retention-days: 7

  recovery-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/run-release-checks.test.mjs
      - name: Rehearse isolated PostgreSQL and versioned private object restore
        run: npm run test:recovery:docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-safe-summary
          path: recovery-test-results/summary.json
          retention-days: 30

  synthetic-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate preview runner access boundaries
        run: node --test scripts/demo-preview.test.mjs
      - name: Start synthetic preview and check readiness and identities
        run: npm run demo:preview:start
      - name: Repeat start without overwriting the synthetic workspace
        run: npm run demo:preview:start
      - name: Check synthetic preview
        run: npm run demo:preview:check
      - name: Stop only the synthetic preview project
        if: always()
        run: npm run demo:preview:stop

  evidence-memory-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:evidence:stress:docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-memory-stress-summary
          path: evidence-stress-test-results/summary.json
          if-no-files-found: warn
