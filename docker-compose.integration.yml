services:
  postgres-integration:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cocoatrace_test
      POSTGRES_USER: cocoa_test
      POSTGRES_PASSWORD: cocoa_test
    ports:
      - "${COCOATRACE_TEST_DB_PORT:-15434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocoa_test -d cocoatrace_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-integration:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: cocoa_test_access
      MINIO_ROOT_PASSWORD: cocoa_test_secret_key
    ports:
      - "${COCOATRACE_TEST_STORAGE_PORT:-19000}:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
