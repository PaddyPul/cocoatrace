services:
  postgres-integration:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cocoatrace_test
      POSTGRES_USER: cocoa_test
      POSTGRES_PASSWORD: cocoa_test
    ports:
      - "${COCOATRACE_TEST_DB_PORT:-15434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocoa_test -d cocoatrace_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  moto-integration:
    image: motoserver/moto:5.2.3
    ports:
      - "${COCOATRACE_TEST_STORAGE_PORT:-19000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('localhost',5000),2); s.close()\""]
      interval: 2s
      timeout: 3s
      retries: 30

  clamav-integration:
    image: clamav/clamav:1.5.4-debian13-slim
    ports:
      - "${COCOATRACE_TEST_SCANNER_PORT:-13310}:3310"
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
