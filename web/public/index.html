<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CocoaTrace — Provenance Platform</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1410;--bg2:#161d17;--bg3:#1c2620;
  --surf:#1f2b22;--surf2:#243028;
  --brd:rgba(120,180,100,0.15);--brd2:rgba(120,180,100,0.25);
  --grn:#6dbe5a;--grn2:#4a9e38;--grn-d:rgba(109,190,90,0.12);
  --amb:#d4a843;--amb-d:rgba(212,168,67,0.12);
  --red:#e05555;--red-d:rgba(224,85,85,0.1);
  --blu:#5aabdb;--blu-d:rgba(90,171,219,0.1);
  --txt:#dde8d8;--txt2:#8fa888;--txt3:#5a7055;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r:10px;--rs:6px;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;font-size:13px;line-height:1.5}
a{color:inherit;text-decoration:none}
input,select,textarea{font-family:var(--font);font-size:13px}

/* Layout */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--brd);display:flex;flex-direction:column;overflow-y:auto}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:52px;background:var(--bg2);border-bottom:1px solid var(--brd);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
#content{flex:1;overflow-y:auto;padding:24px}

/* Login */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-box{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:40px 36px;width:100%;max-width:420px}
.logo-row{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.logo-icon{width:40px;height:40px;background:var(--grn2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.login-title{font-size:20px;font-weight:600;margin-bottom:6px}
.login-sub{color:var(--txt2);font-size:13px;margin-bottom:28px}

/* Sidebar */
.sb-logo{padding:16px 16px 14px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px}
.sb-logo-icon{width:32px;height:32px;background:var(--grn2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sb-logo-txt{font-size:13px;font-weight:600}
.sb-logo-sub{font-size:10px;color:var(--txt3);font-family:var(--mono)}
.nav-section{padding:10px 0}
.nav-label{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;padding:0 16px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;cursor:pointer;color:var(--txt2);font-size:12px;border-left:2px solid transparent;transition:all .15s}
.nav-item:hover{background:var(--grn-d);color:var(--txt)}
.nav-item.active{background:var(--grn-d);color:var(--grn);border-left-color:var(--grn)}
.nav-icon{width:18px;text-align:center;font-size:14px}
.sb-footer{margin-top:auto;padding:12px 16px;border-top:1px solid var(--brd)}
.user-badge{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--grn2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;flex-shrink:0}
.user-name{font-size:12px;font-weight:500}
.user-org{font-size:10px;color:var(--txt3)}
.corridor-dot{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--txt3);font-family:var(--mono)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--grn);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Topbar */
.page-title{font-size:14px;font-weight:600;flex:1}
.btn{padding:6px 14px;border-radius:var(--rs);border:1px solid var(--brd2);background:var(--surf);color:var(--txt);font-family:var(--font);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surf2);border-color:var(--grn2)}
.btn-primary{background:var(--grn2);border-color:var(--grn2);color:#fff}
.btn-primary:hover{background:var(--grn);border-color:var(--grn)}
.btn-danger{background:var(--red-d);border-color:rgba(224,85,85,.3);color:var(--red)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Cards */
.card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card-accent{border-color:rgba(109,190,90,.3)}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:16px}
.stat-card.accent{border-color:rgba(109,190,90,.3)}
.stat-label{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.stat-value{font-size:26px;font-weight:700;font-family:var(--mono);line-height:1}
.stat-sub{font-size:11px;color:var(--txt3);margin-top:5px}

/* Tables */
.table-wrap{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--brd);font-weight:500;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--brd);font-size:12px;color:var(--txt2)}
tr:last-child td{border-bottom:none}
.clickable-row{cursor:pointer}
.clickable-row:hover td{background:var(--grn-d)}
.td-main{color:var(--txt);font-weight:500}
.td-mono{font-family:var(--mono);font-size:11px}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;font-family:var(--mono);white-space:nowrap}
.badge-green{background:var(--grn-d);color:var(--grn);border:1px solid rgba(109,190,90,.2)}
.badge-amber{background:var(--amb-d);color:var(--amb);border:1px solid rgba(212,168,67,.2)}
.badge-red{background:var(--red-d);color:var(--red);border:1px solid rgba(224,85,85,.2)}
.badge-blue{background:var(--blu-d);color:var(--blu);border:1px solid rgba(90,171,219,.2)}
.badge-gray{background:rgba(90,112,85,.1);color:var(--txt3);border:1px solid var(--brd)}

/* Forms */
.form-field{margin-bottom:14px}
.form-label{display:block;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--brd2);border-radius:var(--rs);color:var(--txt);padding:8px 10px;outline:none}
.form-input:focus{border-color:var(--grn2)}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

/* Two/three col */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

/* Section title */
.section-title{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* Alerts */
.alert-warn{background:var(--amb-d);border:1px solid rgba(212,168,67,.3);border-radius:var(--rs);padding:10px 14px;margin-bottom:16px;display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--amb)}
.alert-green{background:var(--grn-d);border:1px solid rgba(109,190,90,.3);border-radius:var(--rs);padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--grn)}
.alert-red{background:var(--red-d);border:1px solid rgba(224,85,85,.3);border-radius:var(--rs);padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--red)}
.alert-error{background:var(--red-d);border:1px solid rgba(224,85,85,.3);border-radius:var(--rs);padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--red)}

/* Progress */
.progress-bar{height:4px;background:var(--brd);border-radius:2px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:2px;transition:width .4s}
.prog-green{background:var(--grn2)}
.prog-amber{background:var(--amb)}
.prog-red{background:var(--red)}

/* Chain */
.chain-item{display:flex;gap:12px}
.chain-left{display:flex;flex-direction:column;align-items:center;width:28px;flex-shrink:0}
.chain-dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--brd2);background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;z-index:1}
.chain-dot.done{background:var(--grn2);border-color:var(--grn);color:#fff}
.chain-dot.active{background:var(--amb-d);border-color:var(--amb)}
.chain-line{width:2px;flex:1;background:var(--brd2);margin:2px 0;min-height:16px}
.chain-body{flex:1;padding-bottom:20px}
.chain-title{font-size:13px;font-weight:500;color:var(--txt)}
.chain-time{font-size:11px;color:var(--txt3);font-family:var(--mono)}
.chain-detail{font-size:12px;color:var(--txt2)}
.chain-hash{font-size:10px;color:var(--txt3);font-family:var(--mono);background:var(--bg3);padding:2px 7px;border-radius:4px;display:inline-block;margin-top:4px}

/* Field rows */
.field-row{margin-bottom:10px}
.field-label{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.field-val{font-size:13px;color:var(--txt)}
.field-val.mono{font-family:var(--mono);font-size:11px;color:var(--txt2)}

.divider{height:1px;background:var(--brd);margin:16px 0}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:var(--txt3);flex-direction:column;gap:12px}
.spinner{width:28px;height:28px;border:3px solid var(--brd2);border-top-color:var(--grn2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.empty-state{text-align:center;padding:48px 24px;color:var(--txt3)}
.empty-icon{font-size:32px;margin-bottom:12px}
.empty-title{font-size:14px;font-weight:600;color:var(--txt2);margin-bottom:6px}

/* Quick login pills */
.quick-login{margin-top:24px;border-top:1px solid rgba(120,180,100,.1);padding-top:18px}
.quick-label{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.quick-pills{display:flex;flex-wrap:wrap;gap:6px}
.quick-pill{padding:4px 10px;background:var(--bg3);border:1px solid var(--brd2);border-radius:20px;color:var(--txt2);font-size:11px;cursor:pointer;transition:all .15s}
.quick-pill:hover{background:var(--grn-d);border-color:var(--grn2);color:var(--grn)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--txt2);margin-bottom:20px}

.tab-row{display:flex;gap:2px;background:var(--bg3);border-radius:var(--rs);padding:3px;margin-bottom:20px}
.tab{padding:6px 14px;border-radius:4px;font-size:12px;cursor:pointer;color:var(--txt2);transition:all .15s}
.tab.active{background:var(--surf);color:var(--txt);font-weight:500}

.milestone-timeline{display:flex;flex-direction:column}
.milestone-row{display:flex;gap:12px;align-items:flex-start}
.milestone-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;margin-top:1px}
.milestone-line{width:2px;flex:1;min-height:24px;margin:2px 0 0 9px}
</style>
</head>
<body>

<div id="app"></div>

<script>
// ============================================================
// STATE
// ============================================================
const API = 'http://localhost:3001';

const state = {
  token: localStorage.getItem('ct_token'),
  user: JSON.parse(localStorage.getItem('ct_user') || 'null'),
  page: 'dashboard',
  data: {},
  modal: null,
  loading: false,
  error: null,
};

function setState(updates) {
  Object.assign(state, updates);
  render();
}

// ============================================================
// API
// ============================================================
async function api(method, path, body, isForm = false) {
  const opts = {
    method,
    headers: state.token ? { Authorization: `Bearer ${state.token}` } : {},
  };
  if (body && !isForm) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  } else if (body && isForm) {
    opts.body = body;
  }
  const res = await fetch(API + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

async function loadPage(page) {
  setState({ page, loading: true, error: null });
  try {
    switch (page) {
      case 'dashboard':  await loadDashboard(); break;
      case 'farms':      state.data.farms = await api('GET', '/farms'); break;
      case 'batches':    state.data.batches = await api('GET', '/batches'); break;
      case 'holdings':   state.data.holdings = await api('GET', '/holdings'); break;
      case 'listings':   state.data.listings = await api('GET', '/listings'); break;
      case 'offers':     state.data.offers = await api('GET', '/offers'); break;
      case 'contracts':  state.data.contracts = await api('GET', '/contracts'); break;
      case 'shipments':  state.data.shipments = await api('GET', '/shipments'); break;
      case 'payments':   state.data.payments = await api('GET', '/payment-requests'); break;
      case 'evidence':   state.data.evidence = await api('GET', '/evidence'); break;
      case 'audit':      state.data.audit = await api('GET', '/audit/events'); break;
    }
  } catch (e) { state.error = e.message; }
  setState({ loading: false });
}

async function loadDashboard() {
  const orgType = state.user?.orgType;
  if (['exporter','admin'].includes(orgType)) {
    const [batches, contracts, shipments] = await Promise.all([
      api('GET', '/batches'), api('GET', '/contracts'), api('GET', '/shipments'),
    ]);
    state.data = { batches, contracts, shipments };
  } else if (orgType === 'farmer') {
    const [farms, batches] = await Promise.all([api('GET', '/farms'), api('GET', '/batches')]);
    state.data = { farms, batches };
  } else if (orgType === 'certifier') {
    const [batches, certs] = await Promise.all([api('GET', '/batches'), api('GET', '/certificates')]);
    state.data = { batches, certs };
  } else if (orgType === 'importer') {
    const [listings, contracts] = await Promise.all([api('GET', '/listings'), api('GET', '/contracts')]);
    state.data = { listings, contracts };
  } else if (orgType === 'logistics') {
    state.data.shipments = await api('GET', '/shipments');
  } else if (orgType === 'regulator') {
    const [audit] = await Promise.all([api('GET', '/audit/events')]);
    state.data = { audit };
  } else {
    const [batches, contracts] = await Promise.all([api('GET', '/batches'), api('GET', '/contracts')]);
    state.data = { batches, contracts };
  }
}

// ============================================================
// AUTH
// ============================================================
async function login(email, password) {
  const data = await api('POST', '/auth/login', { email, password });
  localStorage.setItem('ct_token', data.accessToken);
  localStorage.setItem('ct_user', JSON.stringify(data.user));
  setState({ token: data.accessToken, user: data.user });
  await loadPage('dashboard');
}

function logout() {
  localStorage.removeItem('ct_token');
  localStorage.removeItem('ct_user');
  setState({ token: null, user: null, page: 'login', data: {} });
}

// ============================================================
// HELPERS
// ============================================================
function statusBadge(s) {
  const map = {
    attested: 'green', active: 'green', verified: 'green', approved: 'green', delivered: 'green', settled: 'green', accepted: 'green',
    pending: 'amber', pending_attestation: 'amber', in_transit: 'amber', awaiting_shipment: 'amber', requested: 'amber', departed: 'amber',
    none: 'gray', suspended: 'amber', expired: 'amber',
    disputed: 'red', revoked: 'red', rejected: 'red', cancelled: 'red',
  };
  const cls = map[s] || 'gray';
  return `<span class="badge badge-${cls}">${(s||'').replace(/_/g,' ')}</span>`;
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function fmtMoney(n, currency = 'EUR') {
  return `${currency} ${Number(n || 0).toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}

function milePct(m) {
  const order = ['requested','accepted','picked_up','warehouse_received','port_received','loaded','departed','arrived','customs_cleared','delivered'];
  const i = order.indexOf(m);
  return i < 0 ? 0 : Math.round(((i + 1) / order.length) * 100);
}

function canDo(perm) {
  const perms = state.user?.permissions || [];
  return perms.includes('*') || perms.includes(perm);
}

// ============================================================
// NAV CONFIG
// ============================================================
const NAV = {
  farmer:    [{icon:'🌿',label:'Dashboard',page:'dashboard'},{icon:'🏡',label:'My Farms',page:'farms'},{icon:'📦',label:'Batches',page:'batches'},{icon:'📋',label:'Certificates',page:'certs'}],
  certifier: [{icon:'◉',label:'Dashboard',page:'dashboard'},{icon:'📋',label:'Certificates',page:'certs'},{icon:'⏳',label:'Attest Batches',page:'batches'},{icon:'🏅',label:'Issued Certs',page:'issued_certs'}],
  exporter:  [{icon:'◉',label:'Dashboard',page:'dashboard'},{icon:'📦',label:'Inventory',page:'holdings'},{icon:'🌾',label:'Batches',page:'batches'},{icon:'🏷',label:'Listings',page:'listings'},{icon:'📄',label:'Contracts',page:'contracts'},{icon:'🚢',label:'Shipments',page:'shipments'},{icon:'💰',label:'Payments',page:'payments'},{icon:'🗂',label:'Evidence',page:'evidence'}],
  importer:  [{icon:'◉',label:'Dashboard',page:'dashboard'},{icon:'🏷',label:'Browse Listings',page:'listings'},{icon:'📄',label:'Contracts',page:'contracts'},{icon:'🚢',label:'Shipments',page:'shipments'},{icon:'💰',label:'Payments',page:'payments'}],
  logistics: [{icon:'🚢',label:'Shipments',page:'dashboard'},{icon:'📍',label:'All Shipments',page:'shipments'},{icon:'🗂',label:'Evidence',page:'evidence'}],
  regulator: [{icon:'◉',label:'Audit Dashboard',page:'dashboard'},{icon:'🌾',label:'Farms',page:'farms'},{icon:'📦',label:'Batches',page:'batches'},{icon:'📋',label:'Certificates',page:'certs'},{icon:'🔗',label:'Audit Log',page:'audit'}],
  admin:     [{icon:'◉',label:'Dashboard',page:'dashboard'},{icon:'📦',label:'Batches',page:'batches'},{icon:'📄',label:'Contracts',page:'contracts'},{icon:'🚢',label:'Shipments',page:'shipments'},{icon:'🔗',label:'Audit Log',page:'audit'}],
};

// ============================================================
// RENDER
// ============================================================
function render() {
  const app = document.getElementById('app');
  if (!state.token || !state.user) { app.innerHTML = renderLogin(); bindLoginEvents(); return; }
  if (state.modal) { app.innerHTML = renderShell(renderPage()) + renderModal(); bindEvents(); return; }
  app.innerHTML = renderShell(renderPage());
  bindEvents();
}

function renderShell(content) {
  const orgType = state.user?.orgType || 'admin';
  const navItems = NAV[orgType] || NAV.admin;
  return `
<div id="app">
  <div id="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-icon">🫘</div>
      <div><div class="sb-logo-txt">CocoaTrace</div><div class="sb-logo-sub">Provenance Platform</div></div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Navigation</div>
      ${navItems.map(n => `
        <div class="nav-item ${state.page===n.page?'active':''}" onclick="loadPage('${n.page}')">
          <span class="nav-icon">${n.icon}</span>${n.label}
        </div>`).join('')}
    </div>
    <div class="sb-footer">
      <div class="user-badge">
        <div class="avatar">${(state.user.name||'?').slice(0,2).toUpperCase()}</div>
        <div><div class="user-name">${state.user.name}</div><div class="user-org">${state.user.orgName} · ${orgType}</div></div>
      </div>
      <div class="corridor-dot"><span class="dot"></span> GH → NL active</div>
      <div style="margin-top:10px"><button class="btn btn-sm" style="width:100%;justify-content:center" onclick="logout()">Sign out</button></div>
    </div>
  </div>
  <div id="main">
    <div id="topbar">
      <div class="page-title">${getPageTitle()}</div>
      ${renderTopbarActions()}
    </div>
    <div id="content">
      ${state.loading ? '<div class="loading"><div class="spinner"></div><div>Loading…</div></div>' :
        state.error ? `<div class="alert-red">⚠ ${state.error}</div>` : content}
    </div>
  </div>
</div>`;
}

function getPageTitle() {
  const titles = { dashboard:'Dashboard', farms:'Farms', batches:'Harvest Batches', holdings:'Inventory Holdings', listings:'Listings', offers:'Trade Offers', contracts:'Sales Contracts', shipments:'Shipments', payments:'Payments', evidence:'Evidence Documents', audit:'Audit Log', certs:'Certificates', issued_certs:'Issued Certificates', provenance:'Provenance Pack' };
  return titles[state.page] || state.page;

function renderTopbarActions() {
  const btns = [];
  if (state.page === 'farms' && canDo('batch.create')) btns.push(`<button class="btn btn-sm btn-primary" onclick="openModal('create_farm')">+ New Farm</button>`);
  if (state.page === 'batches' && canDo('batch.create')) btns.push(`<button class="btn btn-sm btn-primary" onclick="openModal('create_batch')">+ Record Harvest</button>`);
  if (state.page === 'listings' && canDo('listing.create')) btns.push(`<button class="btn btn-sm btn-primary" onclick="openModal('create_listing')">+ Create Listing</button>`);
  if (state.page === 'holdings' && canDo('holding.create')) btns.push(`<button class="btn btn-sm btn-primary" onclick="openModal('create_holding')">+ New Holding</button>`);
  if (state.page === 'certs' && canDo('certificate.issue')) btns.push(`<button class="btn btn-sm btn-primary" onclick="openModal('issue_cert')">+ Issue Certificate</button>`);
  if (state.page === 'shipments' && canDo('shipment.request')) btns.push(`<button class="btn btn-sm btn-primary" onclick="openModal('create_shipment')">+ Request Shipment</button>`);

function renderPage() {
  switch (state.page) {
    case 'dashboard': return renderDashboard();
    case 'farms': return renderFarms();
    case 'batches': return renderBatches();
    case 'holdings': return renderHoldings();
    case 'listings': return renderListings();
    case 'offers': return renderOffers();
    case 'contracts': return renderContracts();
    case 'shipments': return renderShipments();
    case 'payments': return renderPayments();
    case 'evidence': return renderEvidence();
    case 'audit': return renderAudit();

    default: return `<div class="empty-state"><div class="empty-icon">🚧</div><div class="empty-title">Coming soon</div></div>`;

function renderDashboard() {
  const orgType = state.user?.orgType;
  if (orgType === 'exporter' || orgType === 'admin') return renderExporterDash();
  if (orgType === 'farmer') return renderFarmerDash();
  if (orgType === 'certifier') return renderCertifierDash();
  if (orgType === 'importer') return renderImporterDash();

  if (orgType === 'regulator') return renderRegulatorDash();

}

async function exportProvenancePack(format = 'json') {
  const pack = state.data.provenancePack;
  if (!pack?.batchId) {
    alert('No provenance pack loaded.');
    return;
  }

  const batchId = pack.batchId;
  const contractId = pack.contractId;

  if (format === 'pdf') {
    // V1 placeholder: use print view until backend PDF endpoint exists
    window.print();
    return;
  }

  let url = `${API}/provenance/batches/${batchId}/export?format=json`;
  if (contractId) {
    url += `&contractId=${encodeURIComponent(contractId)}`;
  }

  const res = await fetch(url, {
    headers: {
      Authorization: `Bearer ${state.token}`,
    },
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    alert(err.error || 'Export failed');
    return;
  }

  const blob = await res.blob();
  const downloadUrl = window.URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = downloadUrl;
  a.download = `provenance-pack-${batchId}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();

  window.URL.revokeObjectURL(downloadUrl);
}

function renderShipmentDetail(data) {
  if (!data) return '<div class="loading"><div class="spinner"></div></div>';
  const { shipment: s, milestones } = data;
  const MILESTONES = ['requested','accepted','picked_up','warehouse_received','port_received','loaded','departed','arrived','customs_cleared','delivered'];
  return `
<div class="modal-title">${s.vessel_name||'Shipment'}</div>
<div class="modal-sub">${s.container_reference||''} · ${s.origin_port} → ${s.destination_port}</div>
<div class="divider"></div>
<div class="section-title">Milestone History</div>
<div class="milestone-timeline">
${MILESTONES.map((ms, i) => {
  const ev = (milestones||[]).find(m=>m.milestone===ms);
  const isCur = ms === s.current_milestone;
  const isDone = MILESTONES.indexOf(ms) < MILESTONES.indexOf(s.current_milestone);
  const clr = isDone ? 'var(--grn2)' : isCur ? 'var(--amb)' : 'var(--brd2)';
  return `<div class="milestone-row">
    <div style="display:flex;flex-direction:column;align-items:center;width:24px;flex-shrink:0">
      <div class="milestone-dot" style="background:${isDone?'var(--grn2)':isCur?'var(--amb-d)':'var(--bg3)'};border:2px solid ${clr}">
        ${isDone?'<span style="color:#fff;font-size:8px">✓</span>':''}
      </div>
      ${i<MILESTONES.length-1?`<div class="milestone-line" style="background:${isDone?'var(--grn2)':'var(--brd2)'}"></div>`:''}
    </div>
    <div style="flex:1;padding-bottom:12px">
      <div style="font-size:12px;font-weight:${isCur?600:400};color:${isDone||isCur?'var(--txt)':'var(--txt3)'}">
        ${ms.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
        ${isCur?'<span style="color:var(--amb);font-size:10px;margin-left:6px">● current</span>':''}
      </div>
      ${ev?`<div style="font-size:11px;color:var(--txt3)">${new Date(ev.recorded_at).toLocaleString()}${ev.location?' · '+ev.location:''}</div>${ev.notes?`<div style="font-size:11px;color:var(--txt2)">${ev.notes}</div>`:''}`:''}
    </div>
  </div>`;}).join('')}
</div>
<button class="btn" onclick="closeModal()">Close</button>`;
}

function bindEvents() {
  // Modal form submissions
  const form = document.getElementById('modal-form');
  if (form) {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('modal-error');
      errEl.innerHTML = '';
      const m = state.modal;
      try {
        const sub = form.querySelector('[type=submit]');
        if (sub) { sub.disabled = true; sub.textContent = 'Saving…'; }
        await handleModalSubmit(m);
        closeModal();
        await loadPage(state.page);
      } catch (err) {
        errEl.innerHTML = `<div class="alert-error">⚠ ${err.message}</div>`;
        const sub = form.querySelector('[type=submit]');
        if (sub) { sub.disabled = false; sub.textContent = 'Submit'; }
      }
    };
  }

  // Evidence upload form
  const evForm = document.getElementById('evidence-form');
  if (evForm) {
    evForm.onsubmit = async (e) => {
      e.preventDefault();
      const file = document.getElementById('ev-file').files[0];
      const type = document.getElementById('ev-type').value;
      const entityId = document.getElementById('ev-entity-id').value || state.user.organizationId;
      const fd = new FormData();
      fd.append('file', file);
      fd.append('type', type);
      fd.append('linkedEntityType', 'batch');
      fd.append('linkedEntityId', entityId);
      fd.append('claimDescription', type.replace(/_/g,' '));
      try {
        await api('POST', '/evidence', fd, true);
        await loadPage('evidence');
      } catch (err) {
        alert('Upload failed: ' + err.message);
      }
    };
  }
}

async function handleModalSubmit(m) {
  const g = id => document.getElementById(id)?.value?.trim();
  switch (m.type) {
    case 'create_farm':
      await api('POST', '/farms', { name: g('f-name'), country: g('f-country')||'GH', region: g('f-region'), district: g('f-district'), community: g('f-community'), officialTraceabilityId: g('f-tid') });
      break;
    case 'create_batch':
      await api('POST', '/batches', { farmId: g('b-farmId'), crop: g('b-crop'), harvestDate: g('b-date'), quantityKg: parseFloat(g('b-qty')), moisturePercent: parseFloat(g('b-moisture'))||undefined, grade: g('b-grade') });
      break;
    case 'attest_batch':
      await api('POST', `/batches/${m.arg1}/attest`, { certificateId: g('a-certId'), notes: g('a-notes') });
      break;
    case 'issue_cert':
      await api('POST', '/certificates', { farmerOrganizationId: g('c-farmerOrgId'), farmId: g('c-farmId'), standard: g('c-standard'), validFrom: g('c-from'), validTo: g('c-to'), issuingAuthority: g('c-authority'), accreditationReference: g('c-ref') });
      break;
    case 'create_holding':
      await api('POST', '/holdings', { batchId: g('h-batchId'), quantityKg: parseFloat(g('h-qty')), warehouseLocation: g('h-warehouse') });
      break;
    case 'create_listing':
      await api('POST', '/listings', { holdingId: g('l-holdingId'), availableQuantityKg: parseFloat(g('l-qty')), pricePerKg: parseFloat(g('l-price')), incoterm: g('l-incoterm'), originLocation: g('l-origin'), destinationLocation: g('l-dest') });
      break;
    case 'make_offer':
      await api('POST', `/listings/${m.arg1}/offers`, { quantityKg: parseFloat(g('o-qty')), offeredPricePerKg: parseFloat(g('o-price')), currency: 'EUR', validUntil: g('o-valid') });
      break;
    case 'create_shipment':
      await api('POST', `/contracts/${g('sh-contractId')}/shipments`, { vesselName: g('sh-vessel'), containerReference: g('sh-container'), originPort: g('sh-origin'), destinationPort: g('sh-dest'), etaArrival: g('sh-eta'), logisticsOrganizationId: g('sh-logId') });
      break;
    case 'add_milestone':
      await api('POST', `/shipments/${m.arg1}/milestones`, { milestone: g('ms-milestone'), location: g('ms-loc'), notes: g('ms-notes') });
      break;
    case 'request_payment':
      await api('POST', `/contracts/${g('pay-contractId')}/payment-requests`, { amountTotal: parseFloat(g('pay-amount')), currency: 'EUR' });
      break;
    case 'pay_invoice':
      await api('POST', `/payment-requests/${m.arg1}/pay`, { transactionReference: g('pi-ref') });
      break;
    case 'transfer_holding':
      await api('POST', `/holdings/${m.arg1}/transfer`, { toOrganizationId: g('tr-toOrgId'), quantityKg: parseFloat(g('tr-qty')) });
      break;
    case 'split_holding':
      const qs = g('sp-quantities').split(',').map(q=>parseFloat(q.trim()));
      await api('POST', `/holdings/${m.arg1}/split`, { quantities: qs });
      break;
  }
}

function bindLoginEvents() {
  const form = document.getElementById('login-form');
  if (form) {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');
      const btn = form.querySelector('[type=submit]');
      btn.disabled = true; btn.textContent = 'Signing in…';
      errEl.innerHTML = '';
      try {
        await login(email, password);
      } catch (err) {
        errEl.innerHTML = `<div class="alert-error">⚠ ${err.message}</div>`;
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    };
  }
  document.querySelectorAll('.quick-pill').forEach(pill => {
    pill.onclick = () => {
      document.getElementById('login-email').value = pill.dataset.email;
      document.getElementById('login-password').value = 'Password123!';
    };
  });
}

async function viewProvenance(batchId, contractId) {
  setState({ page: 'provenance', loading: true, data: { ...state.data, provenancePack: null } });
  try {
    const url = `/provenance/batches/${batchId}${contractId ? `?contractId=${contractId}` : ''}`;
    const pack = await api('GET', url);
    setState({ loading: false, data: { ...state.data, provenancePack: pack } });
  } catch (e) {
    setState({ loading: false, error: e.message });
  }
}

  if (!confirm('Accept this offer and form a contract?')) return;
  try {
    await api('POST', `/offers/${id}/accept`);
    await loadPage('offers');
  } catch (e) { alert(e.message); }
}

  if (!confirm('Reject this offer?')) return;
  try {
    await api('POST', `/offers/${id}/reject`);
    await loadPage('offers');

  try {

    await loadPage('certs');
  } catch (e) { alert(e.message); }
}

async function updateEudr(contractId) {
  const ref = prompt('Enter EUDR due-diligence statement reference number:');

  try {
    await api('PATCH', `/contracts/${contractId}/eudr`, { eudrDueDiligenceReference: ref });
    await loadPage('contracts');
    closeModal();
  } catch (e) { alert(e.message); }
}
