version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cocoatrace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cocoatrace
      POSTGRES_USER: cocoa
      POSTGRES_PASSWORD: cocoa_dev
    ports:
      - "15433:5432"
    volumes:
      - cocoatrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocoa -d cocoatrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: cocoatrace-evidence
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cocoatrace_demo_access}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cocoatrace_demo_secret_change_me}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - cocoatrace_evidence:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: cocoatrace-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      APP_ENV: demo
      NODE_ENV: production
      DEMO_MODE: "true"
      DATABASE_URL: postgresql://cocoa:cocoa_dev@postgres:5432/cocoatrace
      JWT_SECRET: ${JWT_SECRET:-cocoatrace_dev_secret_change_in_production}
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-100}
      WEB_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      EVIDENCE_STORAGE_DRIVER: s3
      EVIDENCE_STORAGE_ENDPOINT: http://minio:9000
      EVIDENCE_STORAGE_REGION: us-east-1
      EVIDENCE_STORAGE_BUCKET: cocoatrace-demo-evidence
      EVIDENCE_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-cocoatrace_demo_access}
      EVIDENCE_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-cocoatrace_demo_secret_change_me}
      EVIDENCE_STORAGE_AUTO_CREATE_BUCKET: "true"
      EVIDENCE_UPLOAD_SIGNING_SECRET: ${EVIDENCE_UPLOAD_SIGNING_SECRET:-cocoatrace_demo_upload_signing_secret}
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3001/health/ready\",r=>process.exit(r.statusCode===200?0:1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_DEMO_MODE: "true"
    container_name: cocoatrace-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      WEB_PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

volumes:
  cocoatrace_pgdata:
  cocoatrace_evidence:
