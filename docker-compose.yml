version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cocoatrace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cocoatrace
      POSTGRES_USER: cocoa
      POSTGRES_PASSWORD: cocoa_dev
    ports:
      - "15433:5432"
    volumes:
      - cocoatrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocoa -d cocoatrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: cocoatrace-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://cocoa:cocoa_dev@postgres:5432/cocoatrace
      JWT_SECRET: ${JWT_SECRET:-cocoatrace_dev_secret_change_in_production}
      WEB_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: cocoatrace-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      WEB_PORT: 3000
    depends_on:
      - api

volumes:
  cocoatrace_pgdata:
