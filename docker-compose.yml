version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cocoatrace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cocoatrace
      POSTGRES_USER: cocoa
      POSTGRES_PASSWORD: cocoa_dev
    ports:
      # Host 15433 -> Container 5432. Avoids Windows/local Postgres conflicts.
      - "15433:5432"
    volumes:
      - cocoatrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocoa -d cocoatrace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cocoatrace_pgdata:
