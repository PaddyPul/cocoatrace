version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cocoatrace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cocoatrace
      POSTGRES_USER: cocoa
      POSTGRES_PASSWORD: cocoa_dev
    ports:
      - "15433:5432"
    volumes:
      - cocoatrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocoa -d cocoatrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    container_name: cocoatrace-clamav
    restart: unless-stopped
    volumes:
      - cocoatrace_clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: cocoatrace-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      APP_ENV: demo
      NODE_ENV: production
      DEMO_MODE: "true"
      DATABASE_URL: postgresql://cocoa:cocoa_dev@postgres:5432/cocoatrace
      JWT_SECRET: ${JWT_SECRET:-cocoatrace_dev_secret_change_in_production}
      PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-100}
      WEB_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      EVIDENCE_STORAGE_DRIVER: local
      EVIDENCE_STORAGE_LOCAL_ROOT: /app/private-evidence
      EVIDENCE_UPLOAD_SIGNING_SECRET: ${EVIDENCE_UPLOAD_SIGNING_SECRET:-cocoatrace_demo_upload_signing_secret}
      EVIDENCE_SCANNER_DRIVER: clamav
      EVIDENCE_SCANNER_HOST: clamav
      EVIDENCE_SCANNER_PORT: "3310"
      EVIDENCE_SCANNER_TIMEOUT_MS: "30000"
      EVIDENCE_SCANNER_RETRIES: "2"
    volumes:
      - cocoatrace_evidence:/app/private-evidence
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3001/health/ready\",r=>process.exit(r.statusCode===200?0:1))'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_DEMO_MODE: "true"
    container_name: cocoatrace-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      WEB_PORT: 3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

volumes:
  cocoatrace_pgdata:
  cocoatrace_evidence:
  cocoatrace_clamav_signatures:
